<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2c3e50"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="520" fill="white"/>

  <!-- gornji red -->
  <rect x="40" y="50" width="240" height="70" rx="10" fill="#eaf2fa" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="160" y="80" text-anchor="middle" font-size="16" fill="#2c3e50">1. Istraživanje planeta</text>
  <text x="160" y="102" text-anchor="middle" font-size="12" fill="#5a6b7b">otkrivanje resursa i totema</text>

  <rect x="340" y="50" width="240" height="70" rx="10" fill="#eaf2fa" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="460" y="80" text-anchor="middle" font-size="16" fill="#2c3e50">2. Ručno rudarenje</text>
  <text x="460" y="102" text-anchor="middle" font-size="12" fill="#5a6b7b">alat + vrijeme držanja tipke</text>

  <rect x="640" y="50" width="240" height="70" rx="10" fill="#eaf2fa" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="760" y="80" text-anchor="middle" font-size="16" fill="#2c3e50">3. Hub skladište</text>
  <text x="760" y="102" text-anchor="middle" font-size="12" fill="#5a6b7b">ručno ili preko uplinka</text>

  <!-- donji red (s desna na lijevo) -->
  <rect x="640" y="260" width="240" height="70" rx="10" fill="#eaf2fa" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="760" y="290" text-anchor="middle" font-size="16" fill="#2c3e50">4. Prag napretka huba</text>
  <text x="760" y="312" text-anchor="middle" font-size="12" fill="#5a6b7b">troši resurse iz skladišta</text>

  <rect x="340" y="260" width="240" height="70" rx="10" fill="#eaf2fa" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="460" y="290" text-anchor="middle" font-size="16" fill="#2c3e50">5. Novi recepti</text>
  <text x="460" y="312" text-anchor="middle" font-size="12" fill="#5a6b7b">alati, strojevi, veći kapacitet</text>

  <rect x="40" y="260" width="240" height="70" rx="10" fill="#eaf2fa" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="160" y="290" text-anchor="middle" font-size="16" fill="#2c3e50">6. Širenje mreže</text>
  <text x="160" y="312" text-anchor="middle" font-size="12" fill="#5a6b7b">veze i teleporteri → novi planeti</text>

  <!-- strelice glavne petlje -->
  <line x1="280" y1="85" x2="336" y2="85" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="580" y1="85" x2="636" y2="85" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="760" y1="120" x2="760" y2="256" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="640" y1="295" x2="584" y2="295" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="340" y1="295" x2="284" y2="295" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="160" y1="260" x2="160" y2="124" stroke="#2c3e50" stroke-width="2" marker-end="url(#arr)"/>

  <!-- sporedne petlje -->
  <rect x="115" y="410" width="320" height="62" rx="10" fill="none" stroke="#8a9aa8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="275" y="436" text-anchor="middle" font-size="14" fill="#5a6b7b">Automatizacija: strojevi prikupljaju,</text>
  <text x="275" y="456" text-anchor="middle" font-size="14" fill="#5a6b7b">prerađuju i šalju resurse sami</text>
  <line x1="275" y1="410" x2="275" y2="334" stroke="#8a9aa8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>

  <rect x="485" y="410" width="320" height="62" rx="10" fill="none" stroke="#8a9aa8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="645" y="436" text-anchor="middle" font-size="14" fill="#5a6b7b">Održavanje: veze degradiraju,</text>
  <text x="645" y="456" text-anchor="middle" font-size="14" fill="#5a6b7b">strojevi se kvare, opasnosti troše zdravlje</text>
  <line x1="645" y1="410" x2="645" y2="334" stroke="#8a9aa8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arr)"/>
</svg>
